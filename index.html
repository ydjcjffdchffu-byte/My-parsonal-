<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My Private Gallery</title>  <link rel="preconnect" href="https://fonts.googleapis.com">  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">  <style>  
  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
font-family:'Poppins',sans-serif;  
}  
  
body{  
background:#090909;  
color:#fff;  
min-height:100vh;  
}  
  
.login{  
height:100vh;  
display:flex;  
justify-content:center;  
align-items:center;  
flex-direction:column;  
padding:20px;  
}  
  
.login h1{  
font-size:35px;  
margin-bottom:20px;  
color:#ff4d6d;  
}  
  
input{  
width:320px;  
max-width:95%;  
padding:15px;  
border:none;  
outline:none;  
border-radius:12px;  
font-size:18px;  
text-align:center;  
margin-bottom:15px;  
}  
  
button{  
padding:14px 35px;  
border:none;  
border-radius:12px;  
background:#ff4d6d;  
color:#fff;  
font-size:18px;  
cursor:pointer;  
transition:.3s;  
}  
  
button:hover{  
transform:scale(1.05);  
}  
  
#app{  
display:none;  
padding:20px;  
}  
  
.title{  
text-align:center;  
font-size:30px;  
margin-bottom:25px;  
color:#ff4d6d;  
}  
  
.top{  
display:flex;  
justify-content:center;  
gap:15px;  
flex-wrap:wrap;  
margin-bottom:25px;  
}  
  
.grid{  
display:grid;  
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));  
gap:18px;  
}  
  
.card{  
background:#1a1a1a;  
border-radius:15px;  
overflow:hidden;  
box-shadow:0 0 15px rgba(255,0,90,.25);  
transition:.3s;  
}  
  
.card:hover{  
transform:translateY(-5px);  
}  
  
.card img,  
.card video{  
width:100%;  
display:block;  
}  
  
.loading{  
text-align:center;  
font-size:18px;  
padding:40px;  
color:#bbb;  
}  
  
</style>  </head>  <body>  <div class="login" id="login">  <h1>🔒 My Gallery</h1>  <input  
type="password"  
id="pass"  
placeholder="Enter Password">

<button onclick="login()">  
Open Gallery  
</button>  </div>  <div id="app">  <h2 class="title">  
❤️ My Private Gallery ❤️  
</h2>  <div class="top">  <button onclick="loadPhotos()">  
📸 Photos  
</button>  <button onclick="loadVideos()">  
🎥 Videos  
</button>  </div>  <div id="gallery" class="grid">  <div class="loading">  
Loading...  
</div>  </div>  </div><!-- Supabase Library -->  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>  
const PASSWORD = "282010";  
  
const SUPABASE_URL = "https://xtsvuqndmubnfjddwjbh.supabase.co";  
  
const SUPABASE_ANON_KEY = "sb_publishable_cd_5v330rdTxh3lae3NBWQ_0R7br0Ba";  
  
const BUCKET = "gallery";  
  
const supabase = window.supabase.createClient(  
  SUPABASE_URL,  
  SUPABASE_ANON_KEY  
);  
  
async function getFiles(folder){  
  const { data, error } = await supabase.storage  
    .from(BUCKET)  
    .list(folder, {  
      limit: 100,  
      sortBy: { column: "name", order: "asc" }  
    });  
  
  if(error){  
    console.error(error);  
    return [];  
  }  
  
  return data.filter(file => file.name);  
}  
  
function publicURL(folder, file){  
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${folder}/${encodeURIComponent(file)}`;  
}  
</script><script>  function login() {
const pass = document.getElementById("pass").value;

if (pass !== PASSWORD) {
alert("Wrong Password!");
return;
}

document.getElementById("login").style.display = "none";
document.getElementById("app").style.display = "block";

loadPhotos();
}

async function loadPhotos() {

const gallery = document.getElementById("gallery");
gallery.innerHTML = "<div class='loading'>Loading Photos...</div>";

const files = await getFiles("Photo");

gallery.innerHTML = "";

if (files.length === 0) {
gallery.innerHTML = "<div class='loading'>No Photos Found</div>";
return;
}

files.forEach(file => {

gallery.innerHTML += `  
  <div class="card">  
    <img  
      src="${publicURL("Photo", file.name)}"  
      loading="lazy"  
      alt="${file.name}">  
  </div>  
`;

});

}

async function loadVideos() {

const gallery = document.getElementById("gallery");
gallery.innerHTML = "<div class='loading'>Loading Videos...</div>";

const files = await getFiles("Video");

gallery.innerHTML = "";

if (files.length === 0) {
gallery.innerHTML = "<div class='loading'>No Videos Found</div>";
return;
}

files.forEach(file => {

gallery.innerHTML += `  
  <div class="card">  
    <video controls preload="metadata">  
      <source  
        src="${publicURL("Video", file.name)}"  
        type="video/mp4">  
    </video>  
  </div>  
`;

});

}

window.onload = () => {

document.getElementById("pass").focus();

document
.getElementById("pass")
.addEventListener("keydown", function(e){

if(e.key==="Enter"){  
    login();  
  }  

});

};
</script>

</body>  
                             </html>
